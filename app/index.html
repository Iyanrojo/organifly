<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="adapter.js"></script>
<link rel="stylesheet" href="adapter.css">

<title>Organifly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: app de tareas de tres zonas — barra lateral de listas, lista central con apartados, panel de detalle a la derecha (hoja a pantalla completa en móvil) */
:root{
  --bg:#FFFFFF; --side:#F4F5F7; --hover:#ECEEF1; --sel:#E3E7EC; --ink:#16191D; --muted:#6B727C; --faint:#A2A8B0; --line:#E6E8EB;
  --done:#2E9E68; --doing:#D4880F; --hot:#E0483A; --star:#E9A21B;
  --c-teal:#1E8C7E; --c-blue:#2F6FE4; --c-violet:#7A52D8; --c-orange:#E06A2A; --c-rose:#D4456F; --c-olive:#6E8A2B;
  color-scheme:light; --brand:#1F8FD6;
  --f:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
:root[data-theme="dark"]{
  --bg:#15171B; --side:#1C1F24; --hover:#262A31; --sel:#2D323A; --ink:#ECEEF1; --muted:#9AA1AB; --faint:#69707A; --line:#2E333B;
  --done:#3DBA7E; --doing:#E7A23A; --hot:#F0645A; --star:#F2B544;
  --c-teal:#2FAE9C; --c-blue:#5B8FF0; --c-violet:#9C7BEA; --c-orange:#F0844A; --c-rose:#E66A90; --c-olive:#93B24A;
  --brand:#47AAE8; color-scheme:dark;
}
.theme-btn{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--bg)}
.theme-btn:hover{color:var(--ink);background:var(--hover)}
.theme-btn svg{width:17px;height:17px}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent, var(--c-teal));outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:264px minmax(0,1fr) auto;height:100%}

/* Barra lateral */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;
  padding:18px 10px 18px max(10px, env(safe-area-inset-left, 0px));overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 18px}
.logo{width:32px;height:32px;flex:0 0 auto}
.wordmark{font-weight:800;font-size:21px;letter-spacing:-.03em;color:var(--ink);white-space:nowrap}
.wordmark .fly{display:inline-block;transform:translateY(.24em) rotate(3deg);color:var(--brand)}
.me{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
.me b{display:block;font-size:15px}
.me span{font-size:12.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;font-size:14.5px}
.nav-item:hover{background:var(--hover)}
.nav-item[aria-current="true"]{background:var(--sel);font-weight:600}
.nav-item svg{width:18px;height:18px;flex:0 0 auto;color:var(--muted)}
.nav-item .cnt{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
.nav-label{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px}
.swatch{width:18px;height:18px;border-radius:5px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:800}
.newlist{display:flex;gap:6px;padding:4px 4px 0}
.newlist input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px}
.addlist{color:var(--muted)}
.addlist:hover{color:var(--ink)}

/* Lista central */
.main{overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.main-inner{width:100%;max-width:820px;margin:0 auto;padding-block:28px 120px;
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:6px}
.topbar{display:none;align-items:center;justify-content:space-between;margin-bottom:6px}
.menu-btn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--muted);padding:6px 8px;border-radius:8px}
.menu-btn:hover{background:var(--hover)}
.list-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.list-head h1{margin:0;font-size:clamp(28px,4vw,36px);font-weight:800;letter-spacing:-.02em;color:var(--accent);line-height:1.1;text-wrap:balance}
.list-head .sub{color:var(--muted);font-size:14px;margin-top:4px}
.newlist[hidden],.adder select[hidden],.nav-item[hidden]{display:none}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);white-space:nowrap}
.ring{width:30px;height:30px}
.list-head{flex-wrap:wrap}
.progress{flex-wrap:wrap}
.foldall{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px 6px 10px;font-size:13px;font-weight:700;color:var(--ink)}
.foldall:hover{border-color:var(--accent);color:var(--accent)}
.fold-ic{display:grid;place-items:center;width:14px;height:14px}
.fold-ic svg{width:13px;height:13px;transform:rotate(-90deg);transition:transform .2s}
.fold-ic.closed svg{transform:rotate(90deg)}

.section{display:flex;flex-direction:column;margin-top:18px}
.section:first-of-type{margin-top:4px}
.sec-head{display:flex;align-items:center;gap:10px;padding:0 4px 6px;border-bottom:1px solid var(--line);margin-bottom:2px}
.sec-head h2{margin:0;font-size:15px;font-weight:700;color:var(--accent)}
.sec-head .n{font-size:12.5px;color:var(--muted)}
.sec-empty{font-size:13.5px;color:var(--faint);padding:10px 6px 4px 42px}
.section:has(.sec-head.big){margin-top:26px}
.sec-head.big{gap:12px;padding:10px 14px;border:0;border-radius:12px;margin-bottom:6px;
  background:color-mix(in srgb,var(--accent) 11%,var(--bg));border-left:5px solid var(--accent)}
.sec-head.big h2{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--accent)}
.sec-head.big .n{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--bg);border-radius:999px;padding:3px 10px}
.sec-head.big{cursor:pointer;user-select:none}
.sec-head.big:hover{background:color-mix(in srgb,var(--accent) 17%,var(--bg))}
.sec-chev{width:22px;height:22px;display:grid;place-items:center;color:var(--accent);flex:0 0 auto}
.sec-chev svg{width:14px;height:14px;transform:rotate(90deg);transition:transform .2s}
.sec-head.collapsed .sec-chev svg{transform:rotate(0deg)}
.sec-head.collapsed{opacity:.92}
.sec-head.big .n.warn{background:color-mix(in srgb,var(--hot) 12%,var(--bg));color:var(--hot)}
.sec-ic{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.sec-ic svg{width:18px;height:18px}

.task{display:flex;align-items:flex-start;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer;position:relative}
.task:hover{background:var(--hover)}
.task[aria-selected="true"]{background:var(--sel)}
.task + .task::before{content:"";position:absolute;left:44px;right:8px;top:0;height:1px;background:var(--line)}
.task:hover::before,.task:hover + .task::before,.task[aria-selected="true"]::before,.task[aria-selected="true"] + .task::before{opacity:0}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);flex:0 0 auto;margin-top:1px;display:grid;place-items:center;position:relative;overflow:hidden;transition:border-color .15s}
.check:hover{border-color:var(--accent)}
.check.doing{border:0;overflow:visible}
.check.doing svg.wip{display:block;width:22px;height:22px;color:var(--doing)}
.check.doing:hover svg.wip{filter:brightness(1.1)}
.check.done{border-color:var(--done);background:var(--done)}
.check.done svg{display:block}
.check svg{display:none;width:12px;height:12px;color:#fff}
.t-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t-title{font-size:14.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.task.is-done .t-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.t-meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.t-meta .note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;min-width:0;flex:1 1 200px}
.prio-b{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.prio-alta{color:var(--hot)}
.prio-media{color:var(--doing)}
.prio-baja{color:var(--faint)}
.seg.prio button[data-p="alta"][aria-pressed="true"]{color:var(--hot)}
.seg.prio button[data-p="media"][aria-pressed="true"]{color:var(--doing)}
.seg.prio button svg{vertical-align:-1px}
.badge{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12px}
.badge.doing{color:var(--doing)}
.badge .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.listtag{display:inline-flex;align-items:center;gap:5px}
.listtag i{width:8px;height:8px;border-radius:2px;display:inline-block}
.phases{display:inline-flex;gap:2px;align-items:center}
.phases i{width:14px;height:4px;border-radius:2px;background:var(--line);display:inline-block}
.phases i.p{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.phases i.n{background:var(--accent)}
.t-side{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.donebtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--done);color:var(--done);background:var(--bg);border-radius:999px;padding:5px 12px 5px 9px;font-size:12.5px;font-weight:700;white-space:nowrap;transition:background .15s,color .15s}
.donebtn svg{width:13px;height:13px}
.donebtn:hover{background:var(--done);color:#fff}
.donebtn.undo{border-color:var(--line);color:var(--muted)}
.donebtn.undo:hover{background:var(--hover);color:var(--ink)}
@media (max-width:520px){.donebtn .lbl{display:none}.donebtn{padding:6px}.t-side{gap:6px}}
.due{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.due.late{color:var(--hot)}
.due.today{color:var(--accent);font-weight:500}
.star{width:20px;height:20px;color:var(--faint);display:grid;place-items:center}
.star.on{color:var(--star)}
.star svg{width:17px;height:17px}

.completed-toggle{display:flex;align-items:center;gap:8px;margin-top:22px;padding:6px 8px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);width:max-content}
.completed-toggle:hover{background:var(--hover)}
.completed-toggle svg{width:14px;height:14px;transition:transform .15s}
.completed-toggle[aria-expanded="true"] svg{transform:rotate(90deg)}

.empty-state{padding:40px 10px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty-state b{color:var(--ink);font-size:16px}

/* Añadir */
.adder{position:sticky;bottom:0;margin-top:auto;padding-block:12px calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));
  background:linear-gradient(to bottom, transparent, var(--bg) 30%)}
.adder form{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--side);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px}
.adder .plus{color:var(--accent);font-size:22px;line-height:1;font-weight:500}
.adder form:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.adder input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;font-size:15px;outline:none}
.adder input::placeholder{color:var(--muted)}
.adder select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:13px;max-width:40%}

/* Detalle */
.detail{width:360px;background:var(--side);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;gap:14px;
  padding:18px max(18px, env(safe-area-inset-right, 0px)) 24px 18px}
.detail[hidden]{display:none!important}
.d-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.d-list{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.iconbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.d-title{display:flex;gap:10px;align-items:flex-start}
.d-title textarea{flex:1;border:0;background:transparent;resize:none;font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1.3;padding:0;outline:none;min-height:24px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--side);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:7px 4px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button[data-v="en_curso"][aria-pressed="true"]{color:var(--doing)}
.seg button[data-v="hecho"][aria-pressed="true"]{color:var(--done)}
.row{display:flex;align-items:center;gap:12px;padding:4px 2px;min-height:34px}
.row svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}
.row label{font-size:14px;flex:0 0 auto;min-width:76px}
.row select,.row input[type=date]{margin-left:auto;border:1px solid var(--line);background:var(--side);border-radius:8px;padding:6px 8px;font-size:13.5px;min-width:0;max-width:62%}
.row + .row{border-top:1px solid var(--line)}
.d-phase{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.d-phase button{border-radius:8px;padding:8px 2px 6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--side);border-top:3px solid var(--line)}
.d-phase button.p{border-top-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--ink)}
.d-phase button.n{border-top-color:var(--accent);color:var(--ink)}
.d-notes{border:0;background:transparent;resize:vertical;min-height:110px;font-size:14px;line-height:1.5;outline:none;width:100%}
.who.clip{gap:5px}
.att{gap:8px}
.att-head{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.att-title{font-size:13.5px;font-weight:700;margin-top:2px}
.att-tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
.att-table{border-collapse:collapse;width:100%;min-width:520px;font-size:12.5px}
.att-table th{background:var(--side);text-align:left;font-weight:700;color:var(--muted);padding:7px 9px;white-space:nowrap;border-bottom:1px solid var(--line)}
.att-table td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
.att-table tr:last-child td{border-bottom:0}
.att-note{font-size:12px;color:var(--muted)}
.att-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none}
.att-link:hover{border-color:var(--c-blue)}
.att-link b{display:block;font-size:13.5px}
.att-link small{display:block;font-size:12px;color:var(--muted)}
.att-ic{width:28px;height:28px;border-radius:8px;background:color-mix(in srgb,var(--c-blue) 12%,var(--bg));color:var(--c-blue);display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.detail{width:400px}
@media (max-width:1080px){ .detail{width:340px} }
.d-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);padding-top:6px;border-top:1px solid var(--line)}
.del{color:var(--hot);font-weight:600;padding:6px 10px;border-radius:8px}
.del:hover,.del.armed{background:color-mix(in srgb,var(--hot) 14%,transparent)}

.pop-layer{position:fixed;width:0;height:0;pointer-events:none;z-index:50}
.pop-bubble{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.95) 0 14%, color-mix(in srgb,var(--done) 35%,transparent) 15% 60%, color-mix(in srgb,var(--done) 70%,transparent) 61%);
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--done) 80%,transparent);animation:bubble .16s ease-out forwards}
.pop-ring{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:2px solid var(--done);opacity:0;animation:ring .45s .13s ease-out forwards}
.pop-drop{position:absolute;left:0;top:0;border-radius:50%;background:var(--done);opacity:0;transform:translate(-50%,-50%);animation:drop .55s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes bubble{0%{transform:scale(.6);opacity:.9}70%{transform:scale(1.35);opacity:1}100%{transform:scale(1.55);opacity:0}}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@keyframes drop{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3)}}
.task.popping{animation:squish .35s ease-out}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(.985)}100%{transform:scale(1)}}
.who{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:11.5px;color:var(--ink);background:var(--sel);border-radius:999px;padding:1px 8px}
.gbtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.gbtn:hover{border-color:var(--c-blue);color:var(--c-blue)}
.gbtn[disabled]{opacity:.6;cursor:progress}
.gok{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--done);font-weight:600}
.gok a{color:var(--c-blue);font-weight:500}
/* Calendario */
.cal-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cal-bar h2{margin:0 6px 0 0;font-size:20px;font-weight:800;min-width:150px}
.cal-nav{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-size:17px;color:var(--muted)}
.cal-nav:hover{background:var(--hover);color:var(--ink)}
.cal-nav{flex:0 0 auto}
@media (pointer:coarse){.cal-nav{width:40px;height:40px}}
@media (max-width:520px){.fin-nav{gap:6px;flex-wrap:wrap}.fin-nav h2{min-width:0;font-size:18px}}
.cal-today{border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:600}
.cal-today:hover{background:var(--hover)}
.gstatus{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gstatus .dot{width:8px;height:8px;border-radius:50%;background:var(--c-blue)}
.gstatus.err{color:var(--hot)}
.gstatus button{border:1px solid currentColor;border-radius:8px;padding:4px 10px;font-weight:600;font-size:12.5px}

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v; // solo iconos propios, nunca datos
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
}

function matches(v, i){
  const t = today();

  if (v.startsWith("w:")) return i.who === v.slice(2) || (i.who === "Todo el equipo");
  switch(v){
    case "hoy": return i.status !== "hecho" && i.due && i.due <= t;
    case "curso": return i.status === "en_curso";
    case "proximos": return i.status !== "hecho" && !!i.due;
    case "importantes": return i.status !== "hecho" && i.priority === "alta";
    case "todas": return i.status !== "hecho";
    case "hechas": return i.status === "hecho";
  }

}

function sortOpen(a, b){
  const so = {en_curso:0, pendiente:1, hecho:2};
  if (a[1].status !== b[1].status) return so[a[1].status] - so[b[1].status];
  const po = {alta:0, media:1, baja:2}; const pa = po[a[1].priority] ?? 1, pb = po[b[1].priority] ?? 1;
  if (pa !== pb) return pa - pb;
  const da = a[1].due || "9", db = b[1].due || "9"; if (da !== db) return da < db ? -1 : 1;
  return (a[1].createdAt||"") < (b[1].createdAt||"") ? -1 : 1;
}

const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function pop(btn, row){
  if (REDUCED || !btn) return;
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;

  layer.append(h("span",{class:"pop-bubble"}), h("span",{class:"pop-ring"}));
  const N = 10;
  for (let k = 0; k < N; k++){
    const a = (k / N) * Math.PI * 2 + Math.random() * .4, dist = 26 + Math.random() * 22, s = 4 + Math.random() * 5;
    const dot = h("span",{class:"pop-drop",style:"--dx:" + (Math.cos(a)*dist).toFixed(1) + "px;--dy:" + (Math.sin(a)*dist).toFixed(1) + "px;width:" + s.toFixed(1) + "px;height:" + s.toFixed(1) + "px;animation-delay:" + (120 + Math.random()*40).toFixed(0) + "ms"});
    layer.append(dot);
  }
  document.body.append(layer);
  setTimeout(() => layer.remove(), 900);
  if (row){ row.classList.add("popping"); }
}

/* ===== Utilidades de dinero y meses ===== */
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const euro = n => (Math.round((Number(n)||0)*100)/100).toLocaleString("es-ES",{minimumFractionDigits:2, maximumFractionDigits:2}) + " €";
const monthKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
function countWeekday(monthDate, wd){ let n = 0; const y = monthDate.getFullYear(), m = monthDate.getMonth(); for (let d = new Date(y,m,1); d.getMonth() === m; d = new Date(y,m,d.getDate()+1)) if (d.getDay() === wd) n++; return n; }
const DAY_NAME = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const dayPl = (wd, n) => DAY_NAME[wd] + (n !== 1 && !DAY_NAME[wd].endsWith("s") ? "s" : "");
function payKey(mk, key){ return mk + "__" + key; }
function isPaid(mk, key){ const p = payments.get(payKey(mk,key)); return !!(p && p.paid); }
async function setPaid(mk, key, val, btn){
  if (val && btn) pop(btn, null);
  if (!pycol) return;
  try { await pycol.doc(payKey(mk,key)).set({paid: !!val, at: new Date().toISOString(), month: mk, key}); } catch(e){ toast("No se ha podido guardar el pago."); }
}
function payTick(mk, key, label){
  const paid = isPaid(mk, key);
  return h("button",{class:"paytick" + (paid ? " on" : ""),type:"button","aria-pressed":String(paid),"aria-label":(paid ? "Marcar como no cobrado: " : "Marcar como cobrado: ") + label,
    onclick:e => setPaid(mk, key, !paid, e.currentTarget)}, h("span",{class:"pt-box",html:ICON.check}), paid ? "Cobrado" : "Pendiente");
}
function studentMonth(l, monthDate){
  const n = countWeekday(monthDate, Number(l.weekday));
  const gross = n * (Number(l.rate)||0);
  return {n, gross, net: gross * (l.net == null ? 1 : Number(l.net))};
}
function studentPayRow(l){
  if (!l.rate) return null;
  const now = new Date(); const md = new Date(now.getFullYear(), now.getMonth(), 1);
  const s = studentMonth(l, md);
  return h("div",{class:"cl-pay"},
    h("div",null, h("div",{class:"cl-paym"}, cap(MONTHS[md.getMonth()]) + ": " + euro(s.net)),
      h("div",{class:"cl-payd"}, s.n + " " + dayPl(l.weekday, s.n) + " × " + euro(l.rate) + (l.net && l.net < 1 ? " − IRPF" : ""))),
    payTick(monthKey(md), "stu_" + l._id, l.name));
}

async function createPlan(title, date, time, project){
  if (mcp){
    const start = time ? date + "T" + time + ":00" : date + "T00:00:00";
    let end;
    if (time){ const [hh,mm] = time.split(":").map(Number); const e = new Date(2000,0,1,hh+1,mm); end = date + "T" + String(e.getHours()).padStart(2,"0") + ":" + String(e.getMinutes()).padStart(2,"0") + ":00"; if (hh >= 23) end = date + "T23:59:00"; }
    else end = iso(addDays(parse(date),1)) + "T00:00:00";
    try {
      const r = await mcp.callTool(GS, "create_event", {summary: title, startTime: start, endTime: end, allDay: !time, description: project ? "Organifly · " + pName(project) : undefined});
      let pl = r && r.payload; if (typeof pl === "string"){ try { pl = JSON.parse(pl); } catch(err){ pl = null; } }
      if (project && plcol){ try { await plcol.doc("p" + Date.now().toString(36)).set({title, date, time: time || null, project, gcalId: pl && pl.id ? String(pl.id) : null, createdAt: new Date().toISOString()}); } catch(err){} }
      if (mcp.invalidate) mcp.invalidate(GS, "list_events").catch(() => {});
      gKey = ""; ensureGoogle();
      toast(project ? "Plan de " + pName(project) + " añadido a Google Calendar" : "Plan añadido a tu Google Calendar");
      return;
    } catch(e){
      const c = e && e.code;
      if (c === "server_unavailable" || c === "upstream_error"){ toast("No sé si se ha creado: revisa Google Calendar antes de repetir."); return; }
      toast(gMsg(c) + " Lo guardo en Organifly.");
    }
  }
  if (plcol){ try { await plcol.doc("p" + Date.now().toString(36)).set({title, date, time: time || null, project: project || null, createdAt: new Date().toISOString()}); toast("Plan guardado"); } catch(e){ toast("No se ha podido guardar el plan."); } }
}

  for (const x of docs){ const s = x.summary || {}; V.push(...(s.vocabulary||[])); C.push(...(s.corrections||[])); P.push(...(s.phrases||[])); G.push(...(s.grammar||[])); }
  const lang = g.lang || "Inglés", L = lang.toLowerCase(); const ex = [];
  const tr = V.filter(v => v.en && v.es).slice(0, 12);
  if (tr.length) ex.push({title:"Translation", instructions:"Traduce al " + L + ".", items: tr.map(v => ({q: v.es, a: v.en}))});
  const gaps = V.filter(v => v.en && v.example && v.example.toLowerCase().includes(String(v.en).toLowerCase())).slice(0, 10);
  if (gaps.length) ex.push({title:"Fill in the gaps", instructions:"Completa con la palabra o expresión adecuada: " + gaps.map(v => v.en).join(" · "), items: gaps.map(v => ({q: v.example.replace(new RegExp(String(v.en).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "i"), "_____"), a: v.en}))});
  if (C.length) ex.push({title:"Correct the mistakes", instructions:"Cada frase tiene un error. Corrígelo.", items: C.slice(0, 10).map(c => ({q: c.wrong, a: c.right}))});
  const ph = P.filter(x => x.en).slice(0, 8);
  if (ph.length) ex.push({title:"Use it", instructions:"Escribe una frase tuya con cada expresión.", items: ph.map(x => ({q: x.en + (x.es ? " (" + x.es + ")" : ""), a: ""}))});
  if (G.length) ex.push({title:"Grammar check", instructions:"Explica con tus palabras y pon un ejemplo.", items: G.slice(0, 6).map(x => ({q: x.point, a: x.explanation || ""}))});
  return {title: "Repaso · " + g.name, intro: "", exercises: ex, auto: false};
}

function quickOrganize(g, raw){
  const vocabulary = [], phrases = [], corrections = [], doubts = [], grammar = []; let homework = "";
  for (let line of String(raw).split(/\n+/)){
    line = line.replace(/^[\s•*·]+/, "").replace(/^-\s+/, "").trim(); if (!line) continue;
    if (/^(deberes|homework|hw)\b\s*:?/i.test(line)){ homework = line.replace(/^(deberes|homework|hw)\b\s*:?\s*/i, ""); continue; }
    if (/^(gramática|gramatica|grammar)\b\s*:?/i.test(line)){ const tx = line.replace(/^\S+\s*:?\s*/, ""); const [pt, ...rest] = tx.split(/\s*(?:=|→|->)\s*|:\s+|\s+[–-]\s+/); grammar.push({point: pt.trim(), explanation: rest.join(" ").trim(), examples: []}); continue; }
    if (/^(duda|doubt|pregunta)\b\s*:?/i.test(line) || ((/^¿/.test(line) || /\?$/.test(line)) && !line.includes("="))){ const tx = line.replace(/^(duda|doubt|pregunta)\b\s*:?\s*/i, ""); const [q, a] = tx.split(/\s*(?:→|->)\s*/); doubts.push({q: q.trim(), a: (a || "").trim()}); continue; }
    if (/[✗✘❌]/.test(line) || /^(x|mal|wrong)\s*:/i.test(line)){ const parts = line.replace(/^(?:[✗✘❌]|x\s*:|mal\s*:|wrong\s*:)\s*/i, "").split(/\s*(?:→|->|=>|✓|✔)\s*/).filter(Boolean); corrections.push({wrong: (parts[0] || "").trim(), right: (parts[1] || "").trim()}); continue; }
    const m = line.split(/\s*(?:=|→|->)\s*|:\s+|\s+[–-]\s+/);
    if (m.length > 1 && m[0].trim()){ const en = m[0].trim(), es = m.slice(1).join(" ").trim(); (en.split(/\s+/).length > 3 ? phrases : vocabulary).push({en, es, example: ""}); continue; }
    phrases.push({en: line, es: ""});
  }
  return {title: "", summary: "", vocabulary, phrases, grammar, corrections, doubts, homework, auto: false};
}

async function summarizeClass(g, raw, quiet){
  const fallback = () => {
    const vocab = [], phrases = [], corr = [], doubts = [];
    for (let line of raw.split(/\n+/)){ line = line.trim(); if (!line) continue;
      let m;
      if (/^(✗|x )/i.test(line) && (m = line.split(/→|->/)).length > 1) corr.push({wrong: m[0].replace(/^(✗|x)\s*/i,"").trim(), right: m[1].replace(/^✓\s*/,"").trim()});
      else if (/^(duda|doubt|\?)/i.test(line)) doubts.push({q: line.replace(/^(duda|doubt)\s*:?\s*/i,""), a: ""});
      else if ((m = line.split(/\s(?:=|–|-|:)\s/)).length > 1){ (m[0].split(" ").length > 3 ? phrases : vocab).push({en: m[0].trim(), es: m.slice(1).join(" - ").trim()}); }
      else phrases.push({en: line, es: ""});
    }
    return {title: "Clase de " + g.name, summary: "", vocabulary: vocab, phrases, grammar: [], corrections: corr, doubts, homework: "", auto: false};
  };
  if (!sample) return fallback();
  const prompt = `Eres el asistente de una persona que es profesora de ${g.lang ? g.lang.toLowerCase() : "inglés"} para adultos hispanohablantes (nivel B1–C1). El idioma que se enseña es ${g.lang || "Inglés"}: en los campos "en" pon el texto en ese idioma.

Devuelve SOLO JSON con esta forma:
{"title":"tema principal en pocas palabras","summary":"1-2 frases en español sobre lo que se vio","vocabulary":[{"en":"palabra o expresión en inglés","es":"traducción","example":"frase de ejemplo breve en inglés"}],"phrases":[{"en":"frase útil en inglés","es":"traducción"}],"grammar":[{"point":"punto gramatical","explanation":"explicación breve en español","examples":["ejemplo"]}],"corrections":[{"wrong":"error","right":"forma correcta"}],"doubts":[{"q":"duda que surgió","a":"respuesta breve"}],"homework":"deberes si aparecen, o vacío"}
Reglas: usa solo lo que aparece en las notas (no inventes temas nuevos); corrige faltas de ortografía; añade la traducción si falta; si una lista no tiene contenido, déjala vacía.
NOTAS:
"""${raw.slice(0, 12000)}"""`;
  try {
    const r = await sample.json(prompt, {cache: false});
    if (!r || typeof r !== "object") return fallback();
    const arr = v => Array.isArray(v) ? v.slice(0, 80) : [];
    return {title: String(r.title || ""), summary: String(r.summary || ""), vocabulary: arr(r.vocabulary), phrases: arr(r.phrases), grammar: arr(r.grammar), corrections: arr(r.corrections), doubts: arr(r.doubts), homework: String(r.homework || ""), auto: true};
  } catch(e){
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) sample = null;
    if (!quiet) toast("No he podido usar Claude para ordenar las notas; las guardo ordenadas de forma básica.");
    return fallback();
  }
}

function invCalc(inv){
  const l = (inv.lines && inv.lines[0]) || {qty:1, price:0};
  const base = Math.round((Number(l.qty)||0) * (Number(l.price)||0) * 100) / 100;
  const iva = inv.ivaPct ? trunc2(base * inv.ivaPct / 100) : 0;
  const irpf = inv.irpfPct ? trunc2(base * inv.irpfPct / 100) : 0;

const dAdd = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return dAdd(x, -((x.getDay() + 6) % 7)); };
function periodRange(p, a){

  if (p === "semana"){ start = mondayOf(a); end = dAdd(start, 7); label = "Semana del " + start.getDate() + " " + MONTHS[start.getMonth()].slice(0,3) + " al " + dAdd(end,-1).getDate() + " " + MONTHS[dAdd(end,-1).getMonth()].slice(0,3);
    for (let i = 0; i < 7; i++) B.push({label: ["L","M","X","J","V","S","D"][i], start: dAdd(start,i), end: dAdd(start,i+1)}); }
  else if (p === "mes"){ start = new Date(a.getFullYear(), a.getMonth(), 1); end = new Date(a.getFullYear(), a.getMonth()+1, 1); label = cap(MONTHS[start.getMonth()]) + " " + start.getFullYear();
    let w = start, n = 1; while (w < end){ const we = new Date(Math.min(dAdd(mondayOf(w),7), end)); B.push({label:"S" + n++, start: w, end: we}); w = we; } }

    for (let i = 0; i < 3; i++) B.push({label: cap(MONTHS[q*3+i].slice(0,3)), start: new Date(a.getFullYear(), q*3+i, 1), end: new Date(a.getFullYear(), q*3+i+1, 1)}); }
  else { start = new Date(a.getFullYear(), 0, 1); end = new Date(a.getFullYear()+1, 0, 1); label = "Año " + start.getFullYear();
    for (let i = 0; i < 12; i++) B.push({label: cap(MONTHS[i].slice(0,1)), start: new Date(a.getFullYear(), i, 1), end: new Date(a.getFullYear(), i+1, 1)}); }

}

function loadDb5Month(mk, md){

function classDates(range){
  // Devuelve {db5:[Date], online:{gid:[Date]}, fromCal:boolean}
  const db5 = []; let fromCal = true;

    const mk = monthKey(m); loadDb5Month(mk, m);
    const ds = db5Dates[mk];
    if (Array.isArray(ds)) db5.push(...ds.filter(d => d >= range.start && d < range.end));
    else { fromCal = false; for (const [gid,g] of groups) if (!g.online){ const ms = new Date(Math.max(m, range.start)), me = new Date(Math.min(new Date(m.getFullYear(), m.getMonth()+1, 1), range.end)); db5.push(...scheduleDates(g.day, ms, me)); } }

  try { localStorage.setItem("ml-collapsed", JSON.stringify([...collapsed])); } catch(e){}
  renderList();
}
function secHead(pid, s, n){
  const key = pid + "::" + s, isCol = collapsed.has(key), warn = isCol && n > 0;
  const badge = warn ? h("span",{class:"n warn"}, n + " sin resolver")
    : h("span",{class:"n"}, n ? n + (n === 1 ? " tarea" : " tareas") : "vacío");
  return h("div",{class:"sec-head big" + (isCol ? " collapsed" : "") + (warn ? " alert" : ""),role:"button",tabindex:"0","aria-expanded":String(!isCol),
      title: isCol ? "Desplegar " + s : "Plegar " + s,
      onclick:()=>toggleSec(key), onkeydown:e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggleSec(key); } }},
    h("span",{class:"sec-ic",html:SEC_ICON[s] || SEC_ICON._}), h("h2",null,s), badge,
    h("span",{class:"sec-chev",html:ICON.chev}));
}

function ring(done, total){
  const r = 12, c = 2*Math.PI*r, f = total ? done/total : 0;
  const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox","0 0 30 30"); s.setAttribute("class","ring");
  s.innerHTML = '<circle cx="15" cy="15" r="12" fill="none" stroke="var(--line)" stroke-width="3"/>' +
    '<circle cx="15" cy="15" r="12" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="' + (c*f).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 15 15)"/>';
  return s;
}

        onclick:()=>{ secTab[pid] = s; try { localStorage.setItem("ml-sectab", JSON.stringify(secTab)); } catch(e){} renderList(); }},
        s === "Todo" ? null : h("span",{html:SEC_ICON[s] || SEC_ICON._,style:"display:contents"}), s, n ? h("span",{class:"c"}, n) : null))));
    if (cur !== "Todo"){

  if (!shownOpen && !isProj){
    const msg = {hoy:["Nada para hoy","Las tareas con fecha de hoy o atrasadas aparecerán aquí."], curso:["Nada en curso","Marca una tarea como «En curso» desde su detalle."],
      proximos:["Sin fechas","Pon fecha a una tarea y la verás aquí, ordenada por día."], importantes:["Sin importantes","Toca la estrella de una tarea."],
      todas:["Todo al día","No tienes nada pendiente."], hechas:["Aún nada completado","Lo que marques como hecho se guarda aquí."]}[view] || ["Vacío",""];

  }
}

/* Calendario + Google Calendar */
let mcp = null, gWatch = null, gKey = "", gEvents = [], gState = "idle", gStored = 0, gBusy = new Set();
let calMonth = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
let calSel = today();
const fMonthY = new Intl.DateTimeFormat("es-ES",{month:"long",year:"numeric"});
const fDayLong = new Intl.DateTimeFormat("es-ES",{weekday:"long",day:"numeric",month:"long"});
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const DENIED = ["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required","not_granted","capability_disabled","capability_removed"];
function gMsg(code){
  return ({server_not_connected:"Vuelve a entrar con Google para conectar el calendario.",
    needs_reauth:"Pulsa «Permitir» para volver a conectar Google Calendar.",
    not_in_manifest:"Organifly no tiene permiso para usar Google Calendar.",
    approval_required:"Organifly necesita tu permiso para leer Google Calendar.",
    blocked_by_policy:"Tu organización no permite usar Google Calendar aquí.",
    selection_required:"Elige qué cuenta de Google Calendar usar en el aviso de Claude.",
    not_granted:"Google Calendar necesita que entres con tu cuenta de Google.",
    capability_disabled:"Google Calendar no está disponible en esta vista.",
    tool_error:"Google Calendar ha rechazado la petición."})[code] || "Google Calendar no responde ahora. Inténtalo en un rato.";
}
function normEvents(evs){
  const out = [];
  for (const e of Array.isArray(evs) ? evs : []){
    if (!e || e.status === "cancelled" || !e.start) continue;
    const title = String(e.summary || "(Sin título)");
    const link = typeof e.htmlLink === "string" && e.htmlLink.startsWith("https://") ? e.htmlLink : null;
    if (typeof e.start.dateTime === "string"){
      const dt = new Date(e.start.dateTime);
      const ok = !isNaN(dt);
      out.push({id:String(e.id||""), rid:String(e.recurringEventId||""), title, date: ok ? iso(dt) : e.start.dateTime.slice(0,10),
        time: ok ? String(dt.getHours()).padStart(2,"0") + ":" + String(dt.getMinutes()).padStart(2,"0") : e.start.dateTime.slice(11,16), link});
    } else if (typeof e.start.date === "string"){
      let d = parse(e.start.date), end = parse(e.end && e.end.date) || addDays(d,1), n = 0;
      while (d < end && n++ < 31){ out.push({id:String(e.id||""), rid:String(e.recurringEventId||""), title, date:iso(d), time:null, link}); d = addDays(d,1); }
    }
  }
  return out;
}
function payloadEvents(res){
  let p = res && res.payload;
  if (typeof p === "string"){ try { p = JSON.parse(p); } catch(e){ p = null; } }
  return p && Array.isArray(p.events) ? p.events : [];
}
function calRange(){
  const first = calMonth, off = (first.getDay() + 6) % 7;
  const start = addDays(first, -off);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const end = addDays(last, 6 - ((last.getDay() + 6) % 7));
  return {start, end};
}
function gInput(){ const {start, end} = calRange(); return {startTime: iso(start) + "T00:00:00", endTime: iso(end) + "T23:59:00", orderBy:"startTime", pageSize:250}; }
function ensureGoogle(){
  if (!mcp || view !== "calendario") return;
  const input = gInput(), key = JSON.stringify(input);
  if (key === gKey) return;
  if (gWatch) gWatch();
  gKey = key; gState = "loading"; gEvents = [];
  gWatch = mcp.watchTool(GS, "list_events", input, ev => {
    if (ev.type === "data"){ gEvents = normEvents(payloadEvents(ev.result)); gState = "ok"; gStored = (ev.result.cache && ev.result.cache.storedAt) || Date.now(); }
    else { const c = ev.error && ev.error.code; if (DENIED.includes(c)) gEvents = []; gState = c || "upstream_error"; }
    if (view === "calendario") renderList();
  }, {refetchInterval: 300000, cache:{staleTime:60000, gcTime:600000}});
}
async function allowGoogle(){
  try { const r = await mcp.callTool(GS, "list_events", gInput()); gEvents = normEvents(payloadEvents(r)); gState = "ok"; gStored = Date.now(); }
  catch(e){ gState = (e && e.code) || "upstream_error"; }
  renderList();
}
function googleControl(id, i){
  if (i.gcalId && i.gcalDate === i.due){
    return h("span",{class:"gok"}, "✓ En tu calendario", i.gcalLink ? h("a",{href:i.gcalLink,target:"_blank",rel:"noopener"},"Abrir") : null);
  }
  if (!mcp) return h("span",{class:"gok",style:"color:var(--muted);font-weight:500"}, "Entra con Google para enviarla a tu calendario");
  return h("button",{class:"gbtn",type:"button",disabled:gBusy.has(id),onclick:()=>pushToGoogle(id)}, gBusy.has(id) ? "Añadiendo…" : (i.gcalId ? "Fecha cambiada: añadir de nuevo" : "Añadir a Google Calendar"));
}
async function pushToGoogle(id){
  const i = it(id); if (!i || !i.due || !mcp || gBusy.has(id)) return;
  gBusy.add(id); renderDetailForce();
  const endIso = iso(addDays(parse(i.due), 1));
  try {
    const r = await mcp.callTool(GS, "create_event", {summary: String(i.title).toUpperCase(), startTime: i.due + "T00:00:00", endTime: endIso + "T00:00:00", allDay: true,
      description: "Organifly · " + pName(projOf(i)) + " · " + secOf(i) + (i.who ? " · con " + i.who : "") + (i.notes ? "\n" + i.notes : "")});
    let p = r && r.payload; if (typeof p === "string"){ try { p = JSON.parse(p); } catch(e){ p = {}; } }
    p = p || {};
    await change(id, {gcalId: String(p.id || "creado"), gcalLink: (typeof p.htmlLink === "string" && p.htmlLink.startsWith("https://")) ? p.htmlLink : null, gcalDate: i.due});
    if (mcp.invalidate) mcp.invalidate(GS, "list_events").catch(() => {});
    toast("Añadida a tu Google Calendar");
  } catch(e){
    const c = e && e.code;
    toast(c === "server_unavailable" || c === "upstream_error" ? "No sé si se ha creado: revisa tu Google Calendar antes de repetir." : gMsg(c));
  } finally { gBusy.delete(id); renderDetailForce(); }
}
function renderDetailForce(){ const d = $("detail"); d.dataset.id = ""; renderDetail(); }

function renderCalendar(body){
  ensureGoogle();
  const t = today();
  const {start, end} = calRange();
  const linked = new Set([...items.values()].filter(i => i.gcalId && i.due).map(i => i.gcalId + "|" + i.due));
  const byDay = new Map();
  const push = (k, v) => { if (!byDay.has(k)) byDay.set(k, {tasks:[], g:[]}); byDay.get(k)[v.kind].push(v); };
  for (const [id,i] of items) if (i.due) push(i.due, {kind:"tasks", id, i});
  for (const [pid,pl] of plans) if (pl.date){ if (pl.gcalId) linked.add(pl.gcalId + "|" + pl.date); push(pl.date, {kind:"g", g:{id:pid, title:pl.title, date:pl.date, time:pl.time || null, link:null, plan:true, project: pl.project || null}}); }
  for (const g of gEvents) if (!linked.has(g.id + "|" + g.date) && !(g.rid && linked.has(g.rid + "|" + g.date))) push(g.date, {kind:"g", g});

  // barra
  let gs;
  if (!mcp) gs = h("div",{class:"gstatus"}, "Entra con tu cuenta de Google para ver tu calendario.");
  else if (gState === "ok") gs = h("div",{class:"gstatus"}, h("span",{class:"dot"}), "Google Calendar conectado" + (gStored ? " · " + new Date(gStored).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}) : ""));
  else if (gState === "loading" || gState === "idle") gs = h("div",{class:"gstatus"}, "Leyendo Google Calendar…");
  else gs = h("div",{class:"gstatus err"}, gMsg(gState),
    (gState === "approval_required" || gState === "not_in_manifest") ? h("button",{type:"button",onclick:allowGoogle},"Permitir") : null,
    (gState === "server_unavailable" || gState === "upstream_error") ? h("button",{type:"button",onclick:()=>{ gKey = ""; ensureGoogle(); }},"Reintentar") : null);
  body.append(h("div",{class:"cal-bar"},
    h("button",{class:"cal-nav",type:"button","aria-label":"Mes anterior",onclick:()=>{ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); renderList(); }},"‹"),
    h("h2",null, cap(fMonthY.format(calMonth))),
    h("button",{class:"cal-nav",type:"button","aria-label":"Mes siguiente",onclick:()=>{ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); renderList(); }},"›"),
    h("button",{class:"cal-today",type:"button",onclick:()=>{ const d = new Date(); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); calSel = today(); renderList(); }},"Hoy"),
    gs));

  // rejilla
  const grid = h("div",{class:"cal",role:"grid","aria-label":"Calendario"});
  for (const w of ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"]) grid.append(h("div",{class:"wd"}, w));
  for (let d = start; d <= end; d = addDays(d,1)){
    const k = iso(d), day = byDay.get(k) || {tasks:[], g:[]};
    const entries = [
      ...day.tasks.sort((a,b) => (a.i.status==="hecho") - (b.i.status==="hecho")).map(x => h("span",{class:"ev" + (x.i.status==="hecho" ? " done" : ""),style:"background:" + pColor(projOf(x.i))}, x.i.title)),
      ...day.g.sort((a,b) => (a.g.time||"") < (b.g.time||"") ? -1 : 1).map(x => h("span",{class:"ev g",style: x.g.project ? "background:" + pColor(x.g.project) + ";color:#fff" : null}, x.g.time ? h("b",null,x.g.time) : null, x.g.title))
    ];
    const total = entries.length, shown = entries.slice(0,3);
    const dots = h("span",{class:"dots"}, [...day.tasks.map(x => h("i",{style:"background:" + pColor(projOf(x.i))})), ...day.g.map(() => h("i",{style:"background:var(--c-blue);opacity:.45"}))].slice(0,4));
    grid.append(h("button",{type:"button",class:"cell" + (d.getMonth() !== calMonth.getMonth() ? " out" : "") + (k === t ? " today" : "") + (k === calSel ? " sel" : ""),
      "aria-label": fDayLong.format(d) + (total ? ", " + total + (total === 1 ? " elemento" : " elementos") : ""),
      onclick:()=>{ calSel = k; if (d.getMonth() !== calMonth.getMonth()) calMonth = new Date(d.getFullYear(), d.getMonth(), 1); renderList(); }},
      h("span",{class:"num"}, d.getDate()), shown, total > 3 ? h("span",{class:"more"}, "+" + (total - 3) + " más") : null, dots));
  }
  body.append(grid);

  // agenda del día seleccionado
  const sel = byDay.get(calSel) || {tasks:[], g:[]};
  const ag = h("section",{class:"agenda"}, h("h3",null, calSel === t ? "Hoy · " + fDayLong.format(parse(calSel)) : cap(fDayLong.format(parse(calSel)))));
  for (const x of sel.g.sort((a,b) => (a.g.time||"") < (b.g.time||"") ? -1 : 1)){
    ag.append(h("div",{class:"gev"}, h("span",{class:"tm"}, x.g.time || "Todo el día"), h("span",{class:"gt"}, x.g.title, h("br"), h("span",{class:"src"}, h("i",{style: x.g.project ? "background:" + pColor(x.g.project) : null}), x.g.project ? "Plan · " + pName(x.g.project) : "Google Calendar")),
      x.g.link ? h("a",{href:x.g.link,target:"_blank",rel:"noopener"},"Abrir") : null));
  }
  for (const x of sel.tasks.sort((a,b) => sortOpen([a.id,a.i],[b.id,b.i]))) ag.append(taskRow(x.id, x.i, {showList:true}));
  if (!sel.g.length && !sel.tasks.length) ag.append(h("div",{class:"sec-empty",style:"padding-left:8px"}, "Nada este día. Escribe abajo para añadir una tarea con esta fecha."));
  body.append(ag);
}

/* Detalle */
let armed = false;
function renderDetail(){
  const d = $("detail");
  const i = selected && it(selected);
  if (!i){ d.hidden = true; d.replaceChildren(); return; }
  const id = selected, pid = projOf(i);
  const focusId = document.activeElement && document.activeElement.id;
  // No pisar lo que se está escribiendo: si el foco está en un campo de texto del mismo detalle, no se redibuja
  if (d.dataset.id === id && (focusId === "d-title" || focusId === "d-notes")) return;
  d.dataset.id = id;
  d.hidden = false;
  const seg = h("div",{class:"seg",role:"group","aria-label":"Estado"}, Object.entries(ST_L).map(([k,l]) =>
    h("button",{type:"button","data-v":k,"aria-pressed":String(i.status===k),onclick:()=>change(id,{status:k})}, l)));
  const title = h("textarea",{id:"d-title",rows:"1","aria-label":"Título",maxlength:"200",
    onblur:e => { const v = e.target.value.trim(); if (v && v !== i.title) change(id,{title:v}); },
    onkeydown:e => { if (e.key === "Enter"){ e.preventDefault(); e.target.blur(); } }});
  title.value = i.title;
  const secSel = h("select",{id:"d-sec",onchange:e => change(id,{section:e.target.value})}, sectionsOf(pid).map(s => h("option",{value:s, selected: s===secOf(i)}, s)));
  const projSel = h("select",{id:"d-proj",onchange:e => { const np = e.target.value; change(id,{project:np, section: sectionsOf(np)[0]}); }},
    projList().map(([p,pp]) => h("option",{value:p, selected: p===pid}, pp.name)));
  const dateIn = h("input",{id:"d-due",type:"date",onchange:e => change(id,{due:e.target.value || null})}); dateIn.value = i.due || "";
  const notes = h("textarea",{id:"d-notes",class:"d-notes",placeholder:"Añadir nota",maxlength:"2000",onblur:e => { if (e.target.value !== (i.notes||"")) change(id,{notes:e.target.value}); }});
  notes.value = i.notes || "";
  let phase = null;
  if (isVideo(i)){
    const cur = PIPE.indexOf(i.phase);
    phase = h("div",{class:"card"}, h("div",{class:"row",style:"border:0;padding:0;min-height:0"}, h("span",{html:ICON.list,style:"display:contents"}), h("label",null,"Fase del vídeo")),
      h("div",{class:"d-phase"}, PIPE.map((p,n) => h("button",{type:"button",class: n<cur ? "p" : n===cur ? "n" : "","aria-pressed":String(n===cur),onclick:()=>change(id,{phase:p})}, PHASE_L[p]))));
  }
  const del = h("button",{class:"del",type:"button",onclick:async e => {
    if (!armed){ armed = true; e.target.classList.add("armed"); e.target.textContent = "Pulsa otra vez"; return; }
    armed = false; selected = null; await removeItem(id); toast("Tarea borrada"); render();
  }}, "Borrar");
  armed = false;
  const created = i.createdAt ? new Date(i.createdAt) : null;
  d.replaceChildren(
    h("div",{class:"d-top"}, h("span",{class:"d-list"}, h("span",{class:"swatch",style:"background:"+pColor(pid)+";width:12px;height:12px;border-radius:3px"}), pName(pid) + " · " + secOf(i)),
      h("button",{class:"iconbtn",type:"button","aria-label":"Cerrar detalle",html:ICON.close,onclick:()=>{selected=null;render();}})),
    h("div",{class:"card"},
      h("div",{class:"d-title"}, title,
        h("button",{class:"star" + (i.priority==="alta" ? " on" : ""),type:"button","aria-label":"Importante",
          html: ICON.star.replace('<svg ','<svg fill="' + (i.priority==="alta" ? "currentColor" : "none") + '" '),
          onclick:()=>change(id,{priority: i.priority === "alta" ? "media" : "alta"})})),
      seg,
      h("div",{class:"seg prio",role:"group","aria-label":"Prioridad"}, Object.entries(PRIO).map(([k,l]) =>
        h("button",{type:"button","data-p":k,"aria-pressed":String((PRIO[i.priority] ? i.priority : "media")===k),onclick:()=>change(id,{priority:k})}, h("span",{html:FLAG,style:"display:contents"}), " " + l)))),
    phase,
    h("div",{class:"card"},
      h("div",{class:"row"}, h("span",{html:ICON.cal,style:"display:contents"}), h("label",{for:"d-due"},"Fecha"), dateIn),
      h("div",{class:"row"}, h("span",{html:ICON.list,style:"display:contents"}), h("label",{for:"d-sec"},"Apartado"), secSel),
      h("div",{class:"row"}, h("span",{html:ICON.folder,style:"display:contents"}), h("label",{for:"d-proj"},"Proyecto"), projSel),
      h("div",{class:"row"}, h("span",{html:ICON.people,style:"display:contents"}), h("label",{for:"d-who"},"Con quién"),
        h("select",{id:"d-who",onchange:e => change(id,{who:e.target.value || null})}, h("option",{value:""},"Solo yo"), WHO_OPTS.map(w => h("option",{value:w, selected: i.who===w}, w)))),
      i.due ? h("div",{class:"row"}, h("span",{html:ICON.gcal,style:"display:contents"}), h("label",null,"Google"), googleControl(id, i)) : null),
    h("div",{class:"card"}, notes),
    renderAttachments(i),
    h("button",{class:"btn2",type:"button",style:"align-self:flex-start",onclick:()=>askLink(id)}, "＋ Añadir enlace"),
    h("div",{class:"d-foot"}, h("span",null, created ? "Creada el " + fLong.format(created) : ""), del)
  );
  if (focusId && $(focusId)) { try { $(focusId).focus(); } catch(e){} }
}
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (menuOpen) setMenu(false); else if (selected){ selected = null; render(); } } });

/* Añadir tarea */
$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const title = $("addInput").value.trim(); if (!title) return;
  if (view === "calendario"){ $("addInput").value = ""; const tm = $("addTime").value; $("addTime").value = ""; askPlanProject(title, calSel, tm); return; }
  const isProj = view.startsWith("p:");
  const pid = isProj ? view.slice(2) : projects.has("hitos") ? "hitos" : (projList()[0] ? projList()[0][0] : "hitos");
  if (pid === "hitos" && !projects.has("hitos") && pcol){ try { await pcol.doc("hitos").set({name:"Hitos", color:"violet", order:0, sections:["General"]}); } catch(e){} }
  const section = isProj ? $("addSection").value : sectionsOf(pid)[0];
  const data = {title, project:pid, section, status: view === "curso" ? "en_curso" : "pendiente", due: view === "hoy" && pid !== "hitos" ? today() : view === "calendario" ? calSel : null, who: view.startsWith("w:") ? view.slice(2) : null,
    priority: view === "importantes" ? "alta" : "media", notes:"", phase: section === "Vídeo" ? "planificacion" : null, kind: section === "Para la reunión" ? "reunion" : "tarea",
    createdAt:new Date().toISOString(), doneAt:null};
  $("addInput").value = "";
  await put(newId(), data);
});

/* Nuevo proyecto */
$("addList").onclick = () => { $("newListForm").hidden = false; $("addList").hidden = true; $("newListName").focus(); };
$("newListName").addEventListener("blur", () => { if (!$("newListName").value.trim()){ $("newListForm").hidden = true; $("addList").hidden = false; } });
$("newListForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("newListName").value.trim(); if (!name) return;
  const slug = (name.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "lista").slice(0,40);
  let pid = slug, n = 2; while (projects.has(pid)) pid = slug + "-" + n++;
  const used = new Set([...projects.values()].map(p => p.color));
  const color = COLORS.find(c => !used.has(c)) || COLORS[projects.size % COLORS.length];
  const data = {name, color, order: projects.size + 1, sections:["General"]};
  $("newListName").value = ""; $("newListForm").hidden = true; $("addList").hidden = false;
  if (pcol){ try { await pcol.doc(pid).set(data); } catch(e){ toast("No se ha podido crear el proyecto."); return; } }
  else { projects.set(pid, data); }
  go("p:" + pid);
});

/* Arranque */
render();
(async () => {
  const c = window.claude;
  if (!c || !c.use){ loaded = true; render(); return; }
  c.use("mcp").then(m => { mcp = m; if (view === "calendario") renderList(); if (selected) renderDetailForce(); });
  const db = await c.use("db");
  if (!db){ loaded = true; $("listSub").textContent = "No se han podido cargar tus datos."; render(); return; }
  col = db.collection("items"); pcol = db.collection("projects"); rcol = db.collection("resources"); acol = db.collection("articles");
  rcol.onSnapshot(snap => { resources = new Map(snap.docs.map(d => [d.id, {...d.data()}])); if (isKitView() && kitTab === "recursos") renderList(); }, () => {});
  dbRef = db;
  { const U = window.ORGANIFLY_USER || {}; if (U.name){ $("meName").textContent = U.name; $("meAv").textContent = U.name.charAt(0).toUpperCase(); } }
  db.doc("settings/invoicing").onSnapshot(d => { const x = d.exists ? d.data() : null; if (!x) return; if (Array.isArray(x.issuer)) ISSUER = x.issuer; if (x.payers) PAYERS = x.payers; if (x.logo) INV_LOGO = x.logo; if (view === "facturas") renderList(); }, () => {});
  db.doc("settings/team").onSnapshot(d => { const x = d.exists ? d.data() : null; TEAM = (x && Array.isArray(x.members)) ? x.members : []; WHO_OPTS = TEAM.length ? [...TEAM.map(t => t[0]), "Todo el equipo"] : []; $("team").previousElementSibling.hidden = !TEAM.length; renderSide(); }, () => {});
  c.use("sample").then(x => { sample = x; }); c.use("downloads").then(x => { downloads = x; });
  gcol = db.collection("groups"); secol = db.collection("sessions"); icol = db.collection("invoices"); pycol = db.collection("payments"); plcol = db.collection("plans");
  const reKit = () => { if (isKitView()) renderList(); };
  gcol.onSnapshot(snap => { groups = new Map(snap.docs.map(d => [d.id, {...d.data()}])); reKit(); }, () => {});
  secol.onSnapshot(snap => { sessions = new Map(snap.docs.map(d => [d.id, {...d.data()}])); if (isKitView() && kitTab === "grupos" && !document.activeElement?.closest?.(".sess-editor")) renderList(); }, () => {});
  icol.onSnapshot(snap => { invoices = new Map(snap.docs.map(d => [d.id, {...d.data()}])); renderSide(); if (view === "facturas") renderList(); }, () => {});
  db.collection("expenses").onSnapshot(snap => { expenses = new Map(snap.docs.map(d => [d.id, {...d.data()}])); if (view === "finanzas") renderList(); }, () => {});
  pycol.onSnapshot(snap => { payments = new Map(snap.docs.map(d => [d.id, {...d.data()}])); if (view === "finanzas" || isKitView()) renderList(); }, () => {});
  plcol.onSnapshot(snap => { plans = new Map(snap.docs.map(d => [d.id, {...d.data()}])); if (view === "calendario") renderList(); }, () => {});
  db.doc("settings/finance").onSnapshot(d => { finSettings = d.exists ? {...d.data()} : {}; DB5_CAL = finSettings.db5Calendar || ""; if (view === "finanzas") renderList(); }, () => {});
  scol = db.collection("shopping"); ncol = db.collection("notes"); lcol = db.collection("classlinks");
  drcol = db.collection("dreams");
  drcol.onSnapshot(snap => { dreams = new Map(snap.docs.map(d => [d.id, {...d.data()}])); renderSide(); if (view === "suenos") renderList(); }, () => {});
  mtcol = db.collection("meetings");
  mtcol.onSnapshot(snap => { meetings = new Map(snap.docs.map(d => [d.id, {...d.data()}])); if (view.startsWith("p:") && !document.activeElement?.closest?.(".mt-new")) renderList(); }, () => {});
  spcol = db.collection("sport");
  spcol.onSnapshot(snap => { sport = new Map();
    for (const d of snap.docs){ const x = d.data() || {};
      if (Array.isArray(x.activities)) for (const a of x.activities){ if (a && a.date) sport.set("s:" + a.id, {...a, source: "strava", url: a.url || null}); }
      else sport.set(d.id, {...x}); } if (view === "deporte" || view === "estadisticas" || view === "hoy") renderList(); }, () => {});
  gpcol = db.collection("giftpeople");
  gpcol.onSnapshot(snap => { giftPeople = new Map(snap.docs.map(d => [d.id, {...d.data()}])); if (view === "compras") renderList(); }, () => {});
  scol.onSnapshot(snap => { shopping = new Map(snap.docs.map(d => [d.id, {...d.data()}])); renderSide(); if (view === "compras") renderList(); }, () => {});
  ncol.onSnapshot(snap => { notes = new Map(snap.docs.map(d => [d.id, {...d.data()}])); renderSide(); if (view === "notas") renderList(); }, () => {});
  lcol.onSnapshot(snap => { classlinks = new Map(snap.docs.map(d => [d.id, {...d.data()}])); if (isKitView()) renderList(); }, () => {});
  acol.onSnapshot(snap => { articles = new Map(snap.docs.map(d => [d.id, {...d.data()}])); if (isKitView() && kitTab === "articulos") renderList(); }, () => {});
  const timer = setTimeout(() => { if (!loaded) toast("Tus tareas aún no han llegado; se cargarán solas."); }, 10000);
  col.onSnapshot(snap => {
    items = new Map(snap.docs.map(d => [d.id, {...d.data()}]));
    if (selected && !items.has(selected)) selected = null;
    if (!snap.metadata.fromCache){ loaded = true; clearTimeout(timer); }
    render();
  }, () => { clearTimeout(timer); loaded = true; toast("No se pueden cargar las tareas ahora mismo."); render(); });
  pcol.onSnapshot(snap => {
    projects = new Map(snap.docs.map(d => [d.id, {...d.data()}]));
    if (view.startsWith("p:") && !projects.has(view.slice(2)) && loaded) view = "hoy";
    render();
  }, () => {});
})();
})();
</script>
